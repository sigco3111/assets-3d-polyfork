{"name":"tmp-skipfix","on":{"push":{"paths":["triggers/skipfix-20261120.txt"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"fix":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"fix","run":"python3 - <<'PY'\nimport os,subprocess\nSK='docs/polyfork-skip.txt'\nNL=chr(10)\nif not os.path.exists(SK):\n    print('NO-SKIP-FILE'); raise SystemExit(0)\nlines=open(SK,encoding='utf-8').read().splitlines()\nkeep=[];drop=[]\nfor l in lines:\n    p=l.split(' ',1)\n    why=p[1].strip() if len(p)>1 else ''\n    if why in ('seasonal','list-filter','seasonal-desc'):\n        drop.append(l)\n    else:\n        keep.append(l)\nprint('DROP',len(drop),'KEEP',len(keep))\nopen('docs/skipfix-20261120.md','w',encoding='utf-8').write('dropped '+str(len(drop))+NL+NL.join(drop)+NL+'kept '+str(len(keep))+NL+NL.join(keep)+NL)\nopen(SK,'w',encoding='utf-8').write((NL.join(keep)+NL) if keep else '')\nsubprocess.run(['git','config','user.name','github-actions[bot]'],check=True)\nsubprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)\nsubprocess.run(['git','add',SK,'docs/skipfix-20261120.md'],check=True)\nsubprocess.run(['git','commit','-m','polyfork skip: 시즌/필터 항목 정리 (일회성)'],check=True)\nfor i in range(3):\n    subprocess.run(['git','pull','--rebase'],check=True)\n    if subprocess.run(['git','push']).returncode==0: break\nPY\n"}]}}}
