{"name":"auto-collect-polyfork","on":{"schedule":[{"cron":"7,37 * * * *"}],"push":{"paths":["triggers/polyfork-live.txt"]},"workflow_dispatch":{}},"concurrency":{"group":"polyfork-collect","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"c":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"collect","env":{"GH_TOKEN":"${{ github.token }}","MAXN":"3"},"run":"pip install trimesh numpy matplotlib pillow\npython3 - <<'PY'\n\nimport json,os,re,glob,zipfile,time,datetime,subprocess,urllib.request,io\nimport numpy as np, trimesh\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\nfrom mpl_toolkits.mplot3d.art3d import Poly3DCollection\nNL=chr(10)\nMAXN=int(os.environ.get('MAXN','3'))\nfor k in ('triggers/auto-collect-stop.txt','triggers/polyfork-stop.txt'):\n    if os.path.exists(k):\n        print('KILL-SWITCH',k); raise SystemExit(0)\ndef get(url,tries=3):\n    err=None\n    for i in range(tries):\n        try:\n            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (asset-catalog collector)'})\n            return urllib.request.urlopen(req,timeout=60).read()\n        except Exception as e:\n            err=e; time.sleep(2)\n    raise err\nrepo=os.environ.get('GITHUB_REPOSITORY','')\ntry:\n    rq=urllib.request.Request('https://api.github.com/repos/'+repo,headers={'Authorization':'Bearer '+os.environ.get('GH_TOKEN',''),'User-Agent':'collector'})\n    size_mb=json.loads(urllib.request.urlopen(rq,timeout=30).read())['size']/1024.0\nexcept Exception as e:\n    print('SIZE-CHECK-FAIL',e); raise SystemExit(0)\nprint('REPO-MB',round(size_mb,1))\nif size_mb>650:\n    print('SIZE-CAP'); raise SystemExit(0)\nurls=set(); names=set(); folders=set(os.path.basename(os.path.dirname(p)) for p in glob.glob('*/meta.json'))\nfor p in glob.glob('*/meta.json'):\n    try:\n        m=json.load(open(p,encoding='utf-8')); urls.add(m.get('url','')); names.add(m.get('name','').lower())\n    except Exception:\n        pass\nLICP=[p for p in ['LICENSE.txt','3d-donut/LICENSE.txt']+glob.glob('*/LICENSE.txt') if os.path.exists(p)]\nassert LICP, 'no LICENSE template'\nLIC=open(LICP[0],encoding='utf-8').read()\nSK='docs/polyfork-skip.txt'\nskipped=set()\nif os.path.exists(SK):\n    skipped=set(l.split(' ')[0] for l in open(SK,encoding='utf-8').read().splitlines() if l.strip())\nSEAS=re.compile('halloween|christmas|xmas|santa|snowman|easter|valentine|thanksgiving|new[- ]?year|advent|gingerbread|candy cane|reindeer|krampus|jack-o|pumpkin|spooky|festive|holiday',re.I)\ntoday=(datetime.datetime.utcnow()+datetime.timedelta(hours=9)).strftime('%Y-%m-%d')\nsubprocess.run(['git','config','user.name','github-actions[bot]'],check=True)\nsubprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)\nnewskips=[]\ndef skip(pid,why):\n    print('SKIP',pid,why); newskips.append(pid+' '+why)\nn=0; page=1\nwhile n<MAXN and page<=40:\n    lst=json.loads(get('https://polyfork.dev/api/assets?free=1&sort=latest&per_page=100&page=%d'%page))\n    rows=lst.get('assets') or []\n    if not rows: break\n    for r in rows:\n        if n>=MAXN: break\n        pid=r['id']; title=(r.get('title') or '').strip()\n        url='https://polyfork.dev/asset/'+pid\n        if url in urls or pid in skipped: continue\n        if r.get('free') is not True:\n            skip(pid,'list-filter'); continue\n        time.sleep(1)\n        try:\n            d=json.loads(get('https://polyfork.dev/api/assets/'+pid))\n        except Exception as e:\n            print('DETAIL-FAIL',pid,e); continue\n        lic=str(d.get('license') or ''); credit=str(d.get('credit') or '').strip()\n        if d.get('free') is not True or 'CC BY 4.0' not in lic or 'by Polyfork' not in credit:\n            skip(pid,'license-or-flags'); continue\n        glb=(d.get('download') or {}).get('glb') or ('https://polyfork.dev/cdn/%s.glb'%pid)\n        if not glb.startswith('https://polyfork.dev/'):\n            skip(pid,'odd-glb-url'); continue\n        try:\n            data=get(glb)\n        except Exception as e:\n            print('GLB-FAIL',pid,e); continue\n        if len(data)==0 or len(data)>25000000:\n            skip(pid,'glb-size-%d'%len(data)); continue\n        big=len(data)>5000000\n        slug=re.sub('[^a-z0-9]+','-',title.lower()).strip('-') or pid\n        if slug in folders: slug=slug+'-'+pid[-6:]\n        name=title if title.lower() not in names else title+' ('+pid[-6:]+')'\n        try:\n            scene=trimesh.load(io.BytesIO(data),file_type='glb',force='scene')\n            mesh=scene.dump(concatenate=True)\n            v=np.asarray(mesh.vertices,dtype=float); f=np.asarray(mesh.faces)\n            assert len(f)>0\n            P=np.stack([v[:,0],-v[:,2],v[:,1]],axis=1)\n            P=P-(P.max(0)+P.min(0))/2\n            P=P/max((P.max(0)-P.min(0)).max(),1e-6)\n            try:\n                fc=np.asarray(mesh.visual.to_color().face_colors,dtype=float)[:,:3]/255.0\n            except Exception:\n                fc=np.full((len(f),3),0.7)\n            nn=np.asarray(mesh.face_normals,dtype=float)\n            nn=np.stack([nn[:,0],-nn[:,2],nn[:,1]],axis=1)\n            L=np.array([0.4,-0.5,0.8]); L=L/np.linalg.norm(L)\n            cols=np.clip(fc*(0.45+0.55*np.clip(nn@L,0,1))[:,None],0,1)\n            fig=plt.figure(figsize=(6,6),dpi=100)\n            ax=fig.add_subplot(111,projection='3d')\n            ax.add_collection3d(Poly3DCollection(P[f],facecolors=cols,edgecolors='none'))\n            ax.set_xlim(-0.6,0.6); ax.set_ylim(-0.6,0.6); ax.set_zlim(-0.6,0.6)\n            ax.set_box_aspect((1,1,1)); ax.view_init(elev=28,azim=-55); ax.set_axis_off()\n            os.makedirs(slug)\n            fig.savefig(slug+'/preview.png',dpi=100,facecolor='white'); plt.close(fig)\n            psz=os.path.getsize(slug+'/preview.png')\n            assert 0<psz<1000000\n        except Exception as e:\n            print('RENDER-FAIL',pid,e)\n            subprocess.run(['rm','-rf',slug])\n            skip(pid,'render-fail'); continue\n        with zipfile.ZipFile(slug+'/'+slug+'.zip','w',zipfile.ZIP_DEFLATED) as z:\n            z.writestr(slug+'.glb',data)\n        fileval=slug+'/'+slug+'.zip'\n        if big:\n            tag='pack-'+slug\n            rc=subprocess.run(['gh','release','create',tag,slug+'/'+slug+'.zip','--title',title,'--notes','Polyfork '+url+' CC BY 4.0'])\n            if rc.returncode!=0:\n                subprocess.run(['rm','-rf',slug]); skip(pid,'release-fail'); continue\n            os.remove(slug+'/'+slug+'.zip'); fileval='release:'+tag+'/'+slug+'.zip'\n        attr='%s by Polyfork (https://polyfork.dev/asset/%s), CC BY 4.0'%(title,pid)\n        meta={'name':name,'slug':slug,'zip':slug+'.zip','file':fileval,'author':'Polyfork','url':url,'license':'CC-BY 4.0','attr':attr,'date':today,'tags':'3d,polyfork,lowpoly','notes':'Polyfork 무료 모델, 메시(GLB)는 CC BY 4.0 선택 (https://polyfork.dev/licensing 확인); 미리보기는 GLB 를 러너에서 직접 렌더; 자동 수집','preview':'preview.png','kind':'3D 모델'}\n        open(slug+'/meta.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=1))\n        open(slug+'/LICENSE.txt','w',encoding='utf-8').write(LIC)\n        open(slug+'/LICENSE-SOURCE.txt','w',encoding='utf-8').write('Source: '+url+NL+'License: CC-BY 4.0 (Polyfork 무료 모델 메시 파일, CC BY 4.0 선택)'+NL+'Checked: '+today+' (GitHub Actions runner, https://polyfork.dev/licensing)'+NL+'Note: 썸네일/렌더/HD/mjs 는 CC BY 범위 밖이라 포함하지 않음')\n        open(slug+'/CREDITS.txt','w',encoding='utf-8').write(title+NL+'제작자: Polyfork'+NL+'출처: '+url+NL+'라이선스: CC-BY 4.0'+NL+'표기: '+attr)\n        open(slug+'/pack.md','w',encoding='utf-8').write('# '+title+NL+NL+'- 라이선스: CC-BY 4.0'+NL+'- 출처: '+url+NL+'- 제작자: Polyfork'+NL+'- 수집일: '+today+' (Polyfork 자동 수집)'+NL+'- 파일: '+slug+'.zip (GLB 포함)'+NL+'- 저장: 저장소 트리 '+slug+'/'+slug+'.zip'+NL+'- 미리보기: GLB 를 러너에서 직접 렌더')\n        subprocess.run(['git','add',slug],check=True)\n        subprocess.run(['git','commit','-m','에셋: '+title+' 추가'],check=True)\n        urls.add(url); names.add(name.lower()); folders.add(slug); n+=1\n        print('ADDED',pid,slug,len(data),psz)\n        time.sleep(1)\n    page+=1\nif newskips:\n    os.makedirs('docs',exist_ok=True)\n    open(SK,'a',encoding='utf-8').write(NL.join(newskips)+NL)\n    subprocess.run(['git','add',SK],check=True)\n    subprocess.run(['git','commit','-m','polyfork 건너뜀 기록'],check=True)\nif n>0 or newskips:\n    for i in range(3):\n        subprocess.run(['git','pull','--rebase'],check=True)\n        if subprocess.run(['git','push']).returncode==0: break\n        time.sleep(5)\nprint('DONE added',n,'skipped',len(newskips))\nPY\n"}]}}}
